org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
org.gradle.caching=true
org.gradle.parallel=true
# kotlin.compiler.execution.strategy=in-process is deliberately left unset. Running
# the Kotlin compiler inside the Gradle daemon makes it share the heap with AGP
# and R8, and R8 is the peak consumer on release builds.
